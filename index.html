<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Behold</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A picture-word game where every answer points to Jesus Christ. 24 levels with a KJV verse for each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column like a stained-glass window: four glass panes up top, answer slots, then the letter tray. Deliberately single-theme (night window). */
:root{
  --night:#0E1A3A; --night-2:#16275A; --lead:#071029; --gold:#F2C14E; --gold-2:#C9962B;
  --tile:#F7F1E3; --tile-ink:#16275A; --ink:#EEF2FF; --muted:#A9B6DA; --good:#5BD49A; --bad:#FF8A80;
  --glass-1:#BFDBFE; --glass-2:#FBCFE8; --glass-3:#BBF7D0; --glass-4:#FDE68A;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Nunito","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--night-2),var(--night) 60%) var(--night);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.06em;color:var(--gold);margin:0;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE7A3,var(--gold) 55%,var(--gold-2));box-shadow:inset 0 0 0 1.5px #A87A1E}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px 10px;font-weight:800;font-size:.9rem}
.lvl{font-weight:800;color:var(--muted);font-size:.9rem;text-align:center;letter-spacing:.08em;text-transform:uppercase}
.window{background:var(--lead);padding:8px;border-radius:22px 22px 14px 14px;box-shadow:0 0 0 2px #2A3B73,0 18px 40px rgba(0,0,0,.35)}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane{aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 3px rgba(7,16,41,.35),inset 0 0 28px rgba(255,255,255,.55)}
.pane:nth-child(1){background:var(--glass-1)}.pane:nth-child(2){background:var(--glass-2)}.pane:nth-child(3){background:var(--glass-3)}.pane:nth-child(4){background:var(--glass-4)}
.pane svg{width:100%;height:100%;display:block}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:52px}
.slot{width:42px;height:50px;border-radius:9px;border:2px solid rgba(255,255,255,.22);background:rgba(7,16,41,.55);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--ink);padding:0}
.slot.filled{background:var(--tile);color:var(--tile-ink);border-color:var(--tile)}
.slot.hinted{background:var(--gold);border-color:var(--gold);color:var(--lead);cursor:default}
.slots.wrong .slot{border-color:var(--bad);color:var(--bad)}
.slots.wrong .slot.filled{background:#FFE4E1;color:#9B1C1C}
.slots.right .slot{background:var(--good);border-color:var(--good);color:var(--lead)}
@media (prefers-reduced-motion:no-preference){.slots.wrong{animation:shake .4s}.tile{transition:transform .08s}.tile:active{transform:scale(.94)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.tile{aspect-ratio:1;border:0;border-radius:10px;background:var(--tile);color:var(--tile-ink);font-family:var(--display);font-weight:800;font-size:1.45rem;box-shadow:0 4px 0 #C9BDA0;padding:0}
.tile.used{visibility:hidden}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 14px;font-weight:800;font-size:.95rem}
.tool .cost{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-variant-numeric:tabular-nums}
.tool:disabled{opacity:.45;cursor:default}
.msg{text-align:center;min-height:1.3em;color:var(--muted);font-weight:700;font-size:.92rem;margin:0}
/* reveal card */
.overlay{position:fixed;inset:0;background:rgba(4,9,24,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{width:100%;max-width:420px;background:linear-gradient(180deg,#1B2E66,#122150);border:1px solid #33478A;border-radius:20px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.card .k{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;color:var(--muted)}
.card h2{font-family:var(--display);font-weight:800;font-size:2.2rem;letter-spacing:.08em;color:var(--gold);margin:0;line-height:1.1}
.card blockquote{margin:0;font-family:var(--display);font-weight:600;font-size:1.08rem;line-height:1.5;color:var(--ink);text-wrap:balance}
.card cite{font-style:normal;font-weight:800;color:var(--gold);font-size:.9rem;letter-spacing:.06em}
.card p{margin:0;color:var(--muted);font-size:.95rem;text-wrap:pretty}
.earn{display:inline-flex;align-items:center;gap:6px;justify-content:center;font-weight:800;color:var(--gold)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;font-size:1rem;background:var(--gold);color:var(--lead);box-shadow:0 4px 0 var(--gold-2)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* level map */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.mapbtn{aspect-ratio:1;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:1.2rem;padding:4px}
.mapbtn small{font-family:var(--display);font-size:.62rem;letter-spacing:.06em;color:var(--gold);font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.mapbtn.done{background:rgba(242,193,78,.14);border-color:rgba(242,193,78,.5)}
.mapbtn.locked{opacity:.4;cursor:default}
.mapbtn.cur{box-shadow:0 0 0 2px var(--gold)}
.foot{color:var(--muted);font-size:.78rem;text-align:center;margin:6px 0 0}
</style>
</head><body>

<div class="app" id="app">
  <div class="bar">
    <h1 class="brand">BEHOLD<small>4 pictures · 1 name of Christ</small></h1>
    <div class="row" style="gap:8px">
      <span class="pill" aria-label="Coins"><span class="coin" aria-hidden="true"></span><span id="coins">0</span></span>
      <button class="iconbtn" id="mapBtn" type="button">Levels</button>
    </div>
  </div>

  <section id="play" aria-label="Puzzle">
    <div class="lvl" id="lvlLabel">Level 1</div>
    <div class="window" style="margin-top:8px"><div class="panes" id="panes"></div></div>
    <div class="slots" id="slots" style="margin-top:16px" aria-label="Your answer"></div>
    <p class="msg" id="msg" role="status" style="margin-top:8px">Tap letters to spell the word all four pictures share.</p>
    <div class="tray" id="tray" style="margin-top:10px" aria-label="Letters"></div>
    <div class="tools" style="margin-top:14px">
      <button class="tool" id="hintBtn" type="button">Reveal a letter <span class="cost"><span class="coin" aria-hidden="true"></span>20</span></button>
      <button class="tool" id="clearBtn" type="button">Clear</button>
    </div>
  </section>

  <section id="levels" aria-label="Levels" hidden>
    <div class="lvl">Choose a level</div>
    <div class="map" id="map"></div>
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="backBtn" type="button">Back to puzzle</button><button class="btn ghost" id="resetBtn" type="button">Reset progress</button></div>
    <p class="msg" id="resetMsg"></p>
  </section>

  <p class="foot">Scripture quotations from the King James Version.</p>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="revWord">
    <div class="k">You found it</div>
    <h2 id="revWord"></h2>
    <blockquote id="revVerse"></blockquote>
    <cite id="revRef"></cite>
    <p id="revNote"></p>
    <div class="earn" id="revEarn"></div>
    <div class="row"><button class="btn" id="nextBtn" type="button">Next level</button></div>
  </div>
</div>

/* ================= STATE ================= */
const $=id=>document.getElementById(id);
const save=(k,v)=>{try{localStorage.setItem('behold_'+k,JSON.stringify(v))}catch(e){}};
const load=(k,d)=>{try{const v=localStorage.getItem('behold_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
let S={lvl:load('lvl',0),done:load('done',[]),coins:load('coins',60)};
let cur=null; // {letters:[{ch,used}], slots:[{i,hint}] }
function rng(seed){let s=seed*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
const ABC='ABCDEFGHIJKLMNOPRSTUW';
function build(i){
  const L=LEVELS[i], r=rng(i+7), letters=L.a.split('');
  while(letters.length<12){const c=ABC[Math.floor(r()*ABC.length)];letters.push(c)}
  for(let k=letters.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[letters[k],letters[j]]=[letters[j],letters[k]]}
  return {letters:letters.map(ch=>({ch,used:false})),slots:L.a.split('').map(()=>null),hints:[]};
}

/* ================= RENDER ================= */
function coins(){$('coins').textContent=S.coins;$('hintBtn').disabled=S.coins<20}
function render(){
  const L=LEVELS[S.lvl];
  $('lvlLabel').textContent=`Level ${S.lvl+1} of ${LEVELS.length}`;
  $('panes').innerHTML=L.p.map(k=>`<div class="pane">${svg(k)}</div>`).join('');
  drawSlots();drawTray();coins();
}
function drawSlots(){
  const s=$('slots');s.className='slots';
  s.innerHTML=cur.slots.map((x,i)=>{const h=cur.hints.includes(i);const ch=h?LEVELS[S.lvl].a[i]:(x!=null?cur.letters[x].ch:'');
    return `<button type="button" class="slot${ch?' filled':''}${h?' hinted':''}" data-i="${i}" aria-label="Letter ${i+1}${ch?': '+ch:''}">${ch}</button>`}).join('');
  s.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(cur.hints.includes(i))return;const x=cur.slots[i];if(x==null)return;cur.letters[x].used=false;cur.slots[i]=null;drawSlots();drawTray()});
}
function drawTray(){
  $('tray').innerHTML=cur.letters.map((l,i)=>`<button type="button" class="tile${l.used?' used':''}" data-i="${i}" ${l.used?'tabindex="-1" aria-hidden="true"':''}>${l.ch}</button>`).join('');
  $('tray').querySelectorAll('.tile').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
}
function pick(i){
  const l=cur.letters[i];if(l.used)return;
  const slot=cur.slots.findIndex((x,k)=>x==null&&!cur.hints.includes(k));if(slot<0)return;
  l.used=true;cur.slots[slot]=i;drawSlots();drawTray();check();
}
function guess(){return cur.slots.map((x,k)=>cur.hints.includes(k)?LEVELS[S.lvl].a[k]:(x!=null?cur.letters[x].ch:'')).join('')}
function check(){
  const g=guess(),A=LEVELS[S.lvl].a;
  if(g.length<A.length||cur.slots.some((x,k)=>x==null&&!cur.hints.includes(k)))return;
  if(g===A){$('slots').className='slots right';setTimeout(win,450)}
  else{$('slots').className='slots wrong';$('msg').textContent='Not quite. Tap a letter in the answer to take it back.';}
}
function win(){
  const L=LEVELS[S.lvl],first=!S.done.includes(S.lvl);
  if(first){S.done.push(S.lvl);S.coins+=10;save('done',S.done);save('coins',S.coins)}
  $('revWord').textContent=L.a;$('revVerse').textContent='“'+L.v+'”';$('revRef').textContent=L.r;$('revNote').textContent=L.n;
  $('revEarn').innerHTML=first?'<span class="coin" aria-hidden="true"></span> +10 coins':'';
  const last=S.lvl>=LEVELS.length-1;$('nextBtn').textContent=last?(S.done.length>=LEVELS.length?'See all levels':'Next unsolved level'):'Next level';
  $('overlay').hidden=false;$('nextBtn').focus();coins();
}
function hint(){
  if(S.coins<20){$('msg').textContent='You need 20 coins. Solve a level to earn 10.';return}
  const A=LEVELS[S.lvl].a;
  const open=A.split('').map((c,k)=>k).filter(k=>!cur.hints.includes(k)&&(cur.slots[k]==null||cur.letters[cur.slots[k]].ch!==A[k]));
  if(!open.length)return;
  const k=open[0];
  if(cur.slots[k]!=null){cur.letters[cur.slots[k]].used=false;cur.slots[k]=null}
  const t=cur.letters.findIndex(l=>!l.used&&l.ch===A[k]);
  if(t<0){ // letter is sitting in a wrong slot; free it
    const s=cur.slots.findIndex((x,j)=>x!=null&&cur.letters[x].ch===A[k]);cur.letters[cur.slots[s]].used=false;cur.slots[s]=null;
  }
  const t2=cur.letters.findIndex(l=>!l.used&&l.ch===A[k]);cur.letters[t2].used=true;cur.hints.push(k);cur.slots[k]=t2;
  S.coins-=20;save('coins',S.coins);$('msg').textContent='Letter revealed.';drawSlots();drawTray();coins();check();
}
function go(i){S.lvl=i;save('lvl',i);cur=build(i);$('msg').textContent='Tap letters to spell the word all four pictures share.';render()}
function showMap(on){
  $('play').hidden=on;$('levels').hidden=!on;$('mapBtn').textContent=on?'Puzzle':'Levels';
  if(!on)return;
  const maxOpen=Math.max(S.lvl,...S.done.map(d=>d+1),0);
  $('map').innerHTML=LEVELS.map((L,i)=>{const done=S.done.includes(i),locked=i>maxOpen&&!done;
    return `<button type="button" class="mapbtn${done?' done':''}${locked?' locked':''}${i===S.lvl?' cur':''}" data-i="${i}" ${locked?'disabled aria-label="Level '+(i+1)+' locked"':''}>${i+1}${done?`<small>${L.a}</small>`:''}</button>`}).join('');
  $('map').querySelectorAll('.mapbtn:not(.locked)').forEach(b=>b.onclick=()=>{go(+b.dataset.i);showMap(false)});
}
$('tray').addEventListener('keydown',()=>{});
document.addEventListener('keydown',e=>{
  if(!$('overlay').hidden){if(e.key==='Enter'){e.preventDefault();$('nextBtn').click()}return}
  if($('play').hidden)return;
  const k=e.key.toUpperCase();
  if(e.key==='Backspace'){const idx=[...cur.slots.keys()].reverse().find(i=>cur.slots[i]!=null&&!cur.hints.includes(i));if(idx!=null){cur.letters[cur.slots[idx]].used=false;cur.slots[idx]=null;drawSlots();drawTray()}return}
  if(/^[A-Z]$/.test(k)){const t=cur.letters.findIndex(l=>!l.used&&l.ch===k);if(t>=0)pick(t)}
});
$('hintBtn').onclick=hint;
$('clearBtn').onclick=()=>{cur.slots.forEach((x,k)=>{if(x!=null&&!cur.hints.includes(k)){cur.letters[x].used=false;cur.slots[k]=null}});$('msg').textContent='Cleared.';drawSlots();drawTray()};
$('nextBtn').onclick=()=>{$('overlay').hidden=true;
  let n=LEVELS.findIndex((_,i)=>i>S.lvl&&!S.done.includes(i));if(n<0)n=LEVELS.findIndex((_,i)=>!S.done.includes(i));
  if(n<0){showMap(true);return}go(n)};
$('mapBtn').onclick=()=>showMap($('levels').hidden);
$('backBtn').onclick=()=>showMap(false);
let armed=false;
$('resetBtn').onclick=()=>{if(!armed){armed=true;$('resetBtn').textContent='Tap again to reset';$('resetMsg').textContent='This clears your solved levels and coins.';return}
  armed=false;S={lvl:0,done:[],coins:60};save('lvl',0);save('done',[]);save('coins',60);$('resetBtn').textContent='Reset progress';$('resetMsg').textContent='Progress reset.';go(0);showMap(true)};
window.__BEHOLD={ART,LEVELS,svg};
go(Math.min(S.lvl,LEVELS.length-1));
})();
</script>
</body></html>
